name = "kotodama-nakama"
main = "worker.js"
compatibility_date = "2025-09-01"

# Daily clean-up of profiles unused for 400 days (worker.js scheduled()).
[triggers]
crons = ["17 4 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "kotodama-nakama"
database_id = "d2562d8e-c714-49c5-a754-5d1adc9af8f3"

# New profiles: at most 5 a minute per IP.
[[ratelimits]]
name = "CREATE_LIMIT"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

# Reading friends' cards: at most 60 a minute per IP (a school or shared
# network still fits; the add-on fetches at most once a minute per person).
[[ratelimits]]
name = "READ_LIMIT"
namespace_id = "1002"
simple = { limit = 60, period = 60 }

# Updating, leaving, deleting: at most 30 a minute per IP.
[[ratelimits]]
name = "WRITE_LIMIT"
namespace_id = "1003"
simple = { limit = 30, period = 60 }
