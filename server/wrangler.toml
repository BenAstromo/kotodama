name = "kotodama-nakama"
main = "worker.js"
compatibility_date = "2025-09-01"

# Daily clean-up of profiles unused for 400 days (worker.js scheduled()).
[triggers]
crons = ["17 4 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "kotodama-nakama"
database_id = "d2562d8e-c714-49c5-a754-5d1adc9af8f3"

# New profiles: at most 5 a minute per IP.
[[ratelimits]]
name = "CREATE_LIMIT"
namespace_id = "1001"
simple = { limit = 5, period = 60 }
